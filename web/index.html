<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VO Studio</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap">
  <h1>VO Studio</h1>
  <div class="muted">Drop a video. The old voiceover is removed, the script is timed, and you get a studio link for the VO artist.</div>

  <h2>New job</h2>
  <div class="card">
    <div class="drop" id="drop">
      <strong>Drop a video here</strong> <span class="muted">or click to pick one</span>
      <input type="file" id="file" accept="video/*" hidden>
      <div class="bar" id="upbar" hidden><i></i></div>
      <div class="muted" id="upmsg" style="margin-top:8px"></div>
    </div>
    <div class="row" style="margin-top:12px">
      <input type="text" id="path" placeholder="…or paste a file path on this PC (no upload needed), e.g. C:\Users\You\Downloads\video.mp4">
      <button id="importBtn">Use file</button>
    </div>
  </div>

  <h2>Jobs</h2>
  <div class="card" style="padding:0" id="jobs"><div class="job"><span class="muted">Loading…</span></div></div>
</div>
<div class="toast" id="toast"></div>
<script src="dashboard.js"></script>
</body>
</html>
